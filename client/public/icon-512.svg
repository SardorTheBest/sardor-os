<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e20" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffab" />
      <stop offset="50%" stop-color="#4edea3" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#222a3d" stroke-width="8" />
  
  <!-- Orbit rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#222a3d" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4edea3" stroke-width="2" opacity="0.3" />
  
  <!-- Zenith Z glyph -->
  <path d="M160 160 L352 160 L190 352 L352 352" fill="none" stroke="url(#brandGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Accent satellite nodes -->
  <circle cx="352" cy="160" r="14" fill="#00e5ff" />
  <circle cx="190" cy="352" r="14" fill="#00ffab" />
</svg>
